<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style id="base">
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: system-ui, sans-serif;
    color: var(--fg);
    transition: background .2s;
  }
  /* 系统主题变量（跟随系统时由 prefers-color-scheme 决定，强制主题由 body class 覆盖） */
  :root {
    --bg: #F1F3F5;
    --fg: #1A1A1A;
    --fg2: #66000000;
    --sbg: rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #E6E6E6;
      --fg2: #99FFFFFF;
      --sbg: rgba(255,255,255,0.08);
    }
  }
  body.theme-light { --bg: #F1F3F5; --fg: #1A1A1A; --fg2: #66000000; --sbg: rgba(0,0,0,0.05); }
  body.theme-dark  { --bg: #121212; --fg: #E6E6E6; --fg2: #99FFFFFF; --sbg: rgba(255,255,255,0.08); }
  /* Via 主题兼容：内容根容器（主题常以 #content fixed+top 落位；left/right 静态时无效，fixed 时保证全宽） */
  #content { position: relative; left: 0; right: 0; width: 100%; }

  #bgimg {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0;
  }
  #wrap {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    height: 100%; padding-top: 16px;
  }
  #incognito {
    display: none; align-items: center; gap: 6px;
    font-size: 12px; color: var(--fg2);
  }
  #incognito.show { display: flex; }
  #logo {
    margin-top: calc(56px + var(--soff, 0px)); max-width: 92vw;
    font-size: 40px; font-weight: 700; color: var(--fg);
    text-align: center;
  }
  #logo img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto; }

  .search_part {
    width: 100%; margin-top: 28px;
    display: flex; justify-content: center;
    position: relative;
  }
  /* 搜索栏（Via 主页结构：.search_part > form.search_bar > #search_row > #search_input）
     原生可调项一律经单类+变量最低特权注入（不用双类/ID 加权）：
     自定义 CSS 同选择器后注入即逐属性覆盖，未写的属性由原生设置兜底 */
  .search_bar {
    display: flex; align-items: center; gap: 4px;
    width: 86%; max-width: 800px; height: var(--sh, 46px); padding: 0 16px;
    border-radius: var(--sr, 23px);
    background: var(--sbg2, rgba(0,0,0,0.05));
    border: var(--sbw, 0px) solid var(--sbc, transparent);
    border-bottom: var(--sbbw, 0px) solid var(--sbc, transparent);
    backdrop-filter: var(--sbf, none);
    -webkit-backdrop-filter: var(--sbf, none);
    position: relative;
  }
  .search_bar svg { flex: none; width: 20px; height: 20px; }
  #search_input {
    flex: 1; min-width: 0;
    border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--fg);
    text-align: left; padding: 0;
    -webkit-user-select: text; user-select: text;
  }
  /* 内嵌 flex 行：不受外层 .search_bar 被 display:table 覆盖影响，保证下拉与输入框同行 */
  #search_row {
    display: flex; align-items: center; gap: 4px;
    width: 100%; height: 100%; min-height: 0; vertical-align: middle;
  }
  /* 引擎选择器（原生引擎下拉 + Logo HTML 脚本注入的 select） */
  .search_bar select {
    max-width: 30%;
    border: none; outline: none; background: transparent;
    color: var(--fg); font-size: 14px;
  }
  /* 原生引擎下拉：左对齐，与输入框同处 #search_row */
  #engine_select {
    flex: none; text-align: left;
    margin: 0; height: 100%;
    padding: 0 2px 0 6px;
    box-sizing: border-box;
  }
  /* 隐藏式提交按钮：默认不显示；主题 display:block 复活为圆形箭头（Via 主题 #search_submit 惯例） */
  #search_submit {
    display: none;
    position: absolute; top: 50%; right: 8px;
    width: 32px; height: 32px; margin-top: -16px; padding: 0;
    border: none; border-radius: 50%;
    background: transparent; color: var(--fg);
    font-size: 18px; text-align: center;
  }

  /* 搜索联想下拉（原生拉取联想后 runJavaScript 推送渲染；点击走 qhBridge.openSuggest） */
  /* 外层定位容器（flex 居中，无 transform：backdrop-filter 元素自带 transform 会错位采样背景） */
  #suggest_box {
    display: none;
    position: absolute; left: 0; right: 0; top: 100%;
    margin-top: 6px;
    justify-content: center;
    pointer-events: none;
    z-index: 50;
    transition: transform .4s ease;
  }
  #suggest_box.show { display: flex; }
  /* 内层面板：矩形样式时与搜索框同挂 search_bar 类——自定义 CSS 的 .search_bar 规则
     （模糊/底色/圆角/阴影）经原生层叠直接命中面板，无需 JS 读计算样式；
     本规则在 .search_bar 之后，仅覆盖布局差异（高度自适应/纵向排列/去内边距） */
  .sg_panel {
    width: 86%; max-width: 800px;
    height: auto; min-height: 0;
    padding: 0; gap: 0;
    flex-direction: column; align-items: stretch;
    background-color: var(--sg-bg, var(--bg));
    background-image: var(--sg-bgimg, none);
    backdrop-filter: var(--sg-bf, none);
    -webkit-backdrop-filter: var(--sg-bf, none);
    border: var(--sg-bw, 0px) solid var(--sg-bc, var(--sbc, transparent));
    border-radius: var(--sg-radius, 16px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    /* 键盘避让限高：键盘弹出时原生推高度收缩可视区，避免下拉被键盘顶住挤压布局 */
    max-height: var(--sg-max, 420px);
    overflow-y: auto;
    pointer-events: auto;
  }
  /* 面板布局守卫（ID 级）：挡住主题 .search_bar 布局类属性（height/display/margin/text-align 等）
     经类共享误伤面板；视觉属性（背景/模糊/圆角/阴影）不守卫，仍由 .search_bar 类共享 + syncSuggestStyle 同步 */
  #sg_panel {
    display: flex; height: auto; min-height: 0;
    margin: 0; padding: 0; gap: 0; text-align: left;
  }
  .sg_row {
    display: flex; align-items: center; gap: 10px;
    height: 46px; padding: 0 16px;
  }
  .sg_row svg { flex: none; width: 17px; height: 17px; color: var(--fg2); }
  .sg_text {
    flex: 1; min-width: 0; font-size: 15px; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sg_url {
    flex: none; max-width: 40%; font-size: 12px; color: var(--fg2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 快捷图标（Via 主页结构：#bookmark_part > #box_container > .box > .title + .label）
     原生可调项同样单类+变量注入，主题 .title/.label 后注入逐属性覆盖 */
  #bookmark_part { width: 100%; }
  #box_container {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 12px; width: 90%; margin-top: 28px;
  }
  .box {
    width: 72px; padding: 4px 0;
    display: flex; flex-direction: column; align-items: center;
  }
  .title {
    width: var(--qw, 48px); height: var(--qh, 48px);
    border-radius: var(--qr, 12px);
    background: var(--accent, #007DFF);
    color: #fff; font-size: var(--qfs, 20px); font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .title img { width: 100%; height: 100%; object-fit: cover; }
  .label {
    margin-top: 6px; font-size: 11px; color: var(--fg);
    max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #empty { height: 72px; }
</style>
<style id="custom"></style>
</head>
<body>
<div id="content">
<div id="wrap">
  <div id="incognito">&#128737; <span id="incognitoText"></span></div>
  <div id="logo"></div>
  <div class="search_part" id="search_part">
    <form class="search_bar" id="search_bar"><div id="search_row"><select id="engine_select"></select><input id="search_input" type="text" autocomplete="off" enterkeyhint="search"></div><input id="search_submit" type="submit" value="&#8594;"></form>
    <div id="suggest_box"><div class="sg_panel" id="sg_panel"></div></div>
  </div>
  <div id="bookmark_part"><div id="box_container"></div></div>
  <div id="empty"></div>
</div>
</div>
<script>
(function () {
  var cfg = null;
  var domReadyDispatched = false;

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* localStorage 不可用环境（resource:// 源）兜底为内存实现，避免注入脚本访问报错 */
  function ensureLocalStorage() {
    try {
      localStorage.setItem('__qh_t', '1');
      localStorage.removeItem('__qh_t');
    } catch (e) {
      try {
        var mem = {};
        Object.defineProperty(window, 'localStorage', {
          configurable: true,
          value: {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
            setItem: function (k, v) { mem[k] = String(v); },
            removeItem: function (k) { delete mem[k]; }
          }
        });
      } catch (e2) { }
    }
  }

  /* 执行 Logo HTML 中的脚本（innerHTML 注入的 <script> 不会执行，需手动重建）；
     按文档顺序串行执行：外部脚本等待加载完成（或失败）后再执行下一个——
     与浏览器原生解析语义一致，兼容外部脚本未加载完、
     内联调用先执行导致的 TypeError */
  function execScripts(root) {
    ensureLocalStorage();
    var list = root.querySelectorAll('script');
    var i = 0;
    function runNext() {
      while (i < list.length) {
        var old = list[i];
        i++;
        var s = document.createElement('script');
        if (old.src) {
          /* 加载成功或失败都继续后续脚本（失败不阻断链） */
          s.onload = runNext;
          s.onerror = runNext;
          s.src = old.src;
          document.body.appendChild(s);
          return;
        }
        try {
          s.text = old.textContent;
          document.body.appendChild(s);
        } catch (e) { }
      }
      /* 全部脚本执行完毕：注入发生在页面加载后，等待 DOMContentLoaded 的脚本已错过事件，补发一次（仅一次，避免重复注册） */
      if (!domReadyDispatched) {
        domReadyDispatched = true;
        try { document.dispatchEvent(new Event('DOMContentLoaded')); } catch (e) { }
      }
    }
    runNext();
  }

  /* 全局搜索（Via 主页协议：读取 #search_input 的值并打开；可被注入脚本包装实现多引擎） */
  window.search = function () {
    var a = document.getElementById('search_input');
    var v = (a.value || '').trim();
    if (v) {
      a.value = '';
      a.blur();
      hideSuggest();
      qhBridge.openUrl(v);
    }
    return false;
  };

  /* 搜索联想（原生拉取后推送渲染；点击走 qhBridge.openSuggest 按索引分发） */
  var SG_ICONS = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>',
    lightbulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5c-.7.6-1 1.5-1 2.5h-6c0-1-.3-1.9-1-2.5A6 6 0 0 1 12 3z"/></svg>',
    history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    tab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="2"/><path d="M9 21h10a2 2 0 0 0 2-2V9"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1-5.5-2.9-5.5 2.9 1-6.1L3 9.5l6.3-.9z"/></svg>'
  };
  function hideSuggest() {
    var box = el('suggest_box');
    var panel = el('sg_panel');
    box.className = '';
    panel.innerHTML = '';
    /* 面板收起后回落多上移的部分（键盘未关时仍保输入框避让） */
    window.qhKbAvoid && window.qhKbAvoid(lastKb);
  }
  window.renderSuggests = function (list) {
    var box = el('suggest_box');
    var panel = el('sg_panel');
    if (!list || !list.length) { hideSuggest(); return; }
    var html = [];
    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      html.push('<div class="sg_row" data-i="' + i + '">'
        + (SG_ICONS[it.type] || SG_ICONS.search)
        + '<span class="sg_text">' + esc(it.text) + '</span>'
        + (it.url ? '<span class="sg_url">' + esc(it.url) + '</span>' : '')
        + '</div>');
    }
    panel.innerHTML = html.join('');
    /* 宽度与搜索框实时一致（含 :focus-within 放大后的宽度），居中由外层容器保证 */
    var bw = el('search_bar').getBoundingClientRect().width;
    if (bw > 0) { panel.style.width = bw + 'px'; }
    box.className = 'show';
    /* 面板展开后重算避让：整页随 logo/搜索框一起上移，保证面板完整避开键盘 */
    window.qhKbAvoid && window.qhKbAvoid(lastKb);
  };
  el('search_input').addEventListener('input', function () {
    var v = this.value.trim();
    if (!v) { hideSuggest(); return; }
    qhBridge.suggest(v);
  });
  /* 失焦延迟隐藏：保证联想行点击先于隐藏生效 */
  el('search_input').addEventListener('blur', function () {
    setTimeout(hideSuggest, 200);
  });
  /* 行点击按索引回原生分发（切标签/直达/搜索），阻止默认避免输入法抢焦点 */
  el('suggest_box').addEventListener('pointerdown', function (e) { e.preventDefault(); });
  el('suggest_box').addEventListener('click', function (e) {
    var row = e.target && e.target.closest ? e.target.closest('.sg_row') : null;
    if (!row) { return; }
    var i = parseInt(row.dataset.i, 10);
    var input = el('search_input');
    input.value = '';
    input.blur();
    hideSuggest();
    qhBridge.openSuggest(i);
  });

  function applyTheme() {
    /* 原生综合背景图亮度/主题/系统深浅判定后下发 bgDark：暗背景浅色字、亮背景深色字 */
    document.body.className = cfg.bgDark ? 'theme-dark' : 'theme-light';
  }
  /* 已应用的背景图缓存：路径没变时仅更新透明度/模糊，不重建元素 */
  var appliedBg = '';
  function bgBlurCss() {
    if (!cfg.bgBlur) { return 'none'; }
    return 'blur(' + cfg.bgBlur + 'px)';
  }
  function applyBg() {
    var src = cfg.bgImage ? 'file://' + cfg.bgImage : '';
    var cur = document.getElementById('bgimg');
    if (src === appliedBg) {
      if (cur) {
        cur.style.opacity = cfg.bgOpacity / 100;
        cur.style.filter = bgBlurCss();
      }
      return;
    }
    appliedBg = src;
    if (cur) { cur.remove(); }
    if (src) {
      var img = document.createElement('img');
      img.id = 'bgimg';
      img.src = src;
      img.style.opacity = cfg.bgOpacity / 100;
      img.style.filter = bgBlurCss();
      document.body.insertBefore(img, document.getElementById('content'));
    }
  }
  /* 已注入的 Logo HTML 缓存：内容没变时跳过重注入，避免重推配置时脚本重跑（天气卡等数据丢失） */
  var appliedLogoHtml = '';
  function applyLogo() {
    var logo = el('logo');
    logo.style.display = '';
    if (cfg.logoMode === 'image' && cfg.logoImage) {
      appliedLogoHtml = '';
      logo.innerHTML = '<img src="file://' + esc(cfg.logoImage) + '">';
    } else if (cfg.logoMode === 'text') {
      appliedLogoHtml = '';
      logo.textContent = cfg.logoText || cfg.appName;
    } else if (cfg.logoMode === 'html') {
      if (cfg.logoHtml === appliedLogoHtml && logo.childElementCount > 0) { return; }
      appliedLogoHtml = cfg.logoHtml;
      logo.innerHTML = '';
      logo.innerHTML = cfg.logoHtml;
      execScripts(logo);
    } else if (cfg.logoMode === 'none') {
      logo.style.display = 'none';
    } else {
      appliedLogoHtml = '';
      logo.textContent = cfg.appName;
    }
  }

  /* 原生下发过的默认词缓存：注入脚本自定义过 placeholder 后不再覆盖（脚本优先） */
  var appliedHint = '';
  function applySearch() {
    var s = el('search_bar');
    var r = document.documentElement.style;
    var dark = cfg.bgDark;
    var base = dark ? '255,255,255' : '0,0,0';
    r.setProperty('--sbc', 'rgba(' + base + ',' + (cfg.searchBorderOpacity / 100 * (dark ? 0.6 : 0.4)) + ')');
    var input = el('search_input');
    if (input.placeholder === appliedHint) {
      appliedHint = cfg.hint || '';
      input.placeholder = appliedHint;
    }
    if (!cfg.showSearchArea) { el('search_part').style.display = 'none'; return; }
    el('search_part').style.display = '';
    s.className = 'search_bar';
    /* 高度 / 垂直偏移（联动 Logo 顶部间距） */
    r.setProperty('--sh', (cfg.searchHeight > 0 ? cfg.searchHeight : 46) + 'px');
    r.setProperty('--soff', (cfg.searchOffset || 0) + 'px');
    /* 原生样式（矩形/线条/模糊/描边）全部经变量注入搜索框，不再用双类/ID 加权；
       自定义 CSS 的 .search_bar 规则后注入即逐属性胜出 */
    var panel = el('sg_panel');
    panel.className = 'sg_panel';
    if (cfg.searchStyle === 'line') {
      r.setProperty('--sr', '0px');
      r.setProperty('--sbw', '0px');
      r.setProperty('--sbbw', (cfg.searchBorderWidth > 0 ? cfg.searchBorderWidth : 1.5) + 'px');
      r.setProperty('--sbg2', 'transparent');
      r.setProperty('--sbf', 'none');
    } else {
      r.setProperty('--sr', cfg.searchRadius + 'px');
      r.setProperty('--sbw', cfg.searchBorderWidth + 'px');
      r.setProperty('--sbbw', '0px');
      r.setProperty('--sbf',
        (cfg.searchEffect === 'blur' && cfg.searchBlur > 0) ? ('blur(' + cfg.searchBlur + 'px)') : 'none');
      if (cfg.searchEffect === 'transparent') {
        r.setProperty('--sbg2', 'transparent');
      } else {
        r.setProperty('--sbg2', 'rgba(' + base + ',' + (cfg.searchOpacity / 100 * 0.08) + ')');
      }
      /* 面板与搜索框同类：矩形样式挂 search_bar，自定义 CSS 的 .search_bar 视觉规则直接命中面板 */
      panel.classList.add('search_bar');
    }
    /* 联想下拉背景与搜索框同步：线条样式回落卡片默认，矩形样式同底色/模糊/描边/圆角
       （透明效果下拉需可读性，底色回落 8% 半透明 + 毛玻璃） */
    if (cfg.searchStyle === 'line') {
      r.setProperty('--sg-bg', 'var(--bg)');
      r.setProperty('--sg-bf', 'none');
      r.setProperty('--sg-bw', '0px');
      r.setProperty('--sg-radius', '16px');
    } else {
      var sgOp = cfg.searchEffect === 'transparent' ? 0.08 : (cfg.searchOpacity / 100 * 0.08);
      var sgBlur = (cfg.searchEffect === 'blur' || cfg.searchEffect === 'transparent') ? 'blur(16px)' : 'none';
      r.setProperty('--sg-bg', 'rgba(' + base + ',' + sgOp + ')');
      r.setProperty('--sg-bf', sgBlur);
      r.setProperty('--sg-bw', cfg.searchBorderWidth + 'px');
      r.setProperty('--sg-radius', Math.max(16, cfg.searchRadius) + 'px');
    }
  }

  function applyQuick() {
    var box = el('box_container');
    var r = document.documentElement.style;
    r.setProperty('--qw', (cfg.quickWidth > 0 ? cfg.quickWidth : 48) + 'px');
    r.setProperty('--qh', (cfg.quickHeight > 0 ? cfg.quickHeight : 48) + 'px');
    r.setProperty('--qr', cfg.quickRadius + 'px');
    r.setProperty('--qfs', Math.max(12, Math.min(28, (cfg.quickHeight > 0 ? cfg.quickHeight : 48) * 0.42)) + 'px');
    r.setProperty('--accent', cfg.accent);
    box.innerHTML = '';
    for (var i = 0; i < cfg.items.length; i++) {
      var it = cfg.items[i];
      var d = document.createElement('div');
      d.className = 'box';
      d.dataset.url = it.url;
      var ava = '<div class="title">';
      if (cfg.quickIconStyle === 'icon' && it.icon) {
        ava += '<img src="file://' + esc(it.icon) + '">';
      } else {
        ava += esc(it.title ? it.title.charAt(0) : '?');
      }
      ava += '</div>';
      d.innerHTML = ava + '<div class="label">' + esc(it.title) + '</div>';
      bindQuick(d, it);
      box.appendChild(d);
    }
  }

  var pressTimer = null;
  function bindQuick(d, it) {
    d.addEventListener('click', function () {
      if (pressTimer) { return; }
      qhBridge.openUrl(it.url);
    });
    d.addEventListener('touchstart', function () {
      pressTimer = setTimeout(function () {
        pressTimer = null;
        qhBridge.removeQuick(it.url, it.title);
        pressTimer = 'blocked';
        setTimeout(function () { pressTimer = null; }, 400);
      }, 500);
    }, { passive: true });
    d.addEventListener('touchend', function () {
      if (pressTimer && pressTimer !== 'blocked') { clearTimeout(pressTimer); pressTimer = null; }
    });
    d.addEventListener('touchmove', function () {
      if (pressTimer && pressTimer !== 'blocked') { clearTimeout(pressTimer); pressTimer = null; }
    });
  }

  /* 表单提交（回车/提交按钮）走全局 search */
  el('search_bar').addEventListener('submit', function (e) {
    e.preventDefault();
    window.search();
  });

  /* 输入法确认键（搜索/回车）直接触发全局 search（阻止默认提交避免二次触发） */
  el('search_input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      window.search();
    }
  });

  /* 原生引擎下拉：选项来自应用引擎列表，切换即改应用当前搜索引擎 */
  function applyEngines() {
    var sel = el('engine_select');
    if (!cfg.engines || !cfg.engines.length) {
      sel.style.display = 'none';
      return;
    }
    sel.style.display = '';
    var opts = [];
    for (var i = 0; i < cfg.engines.length; i++) {
      opts.push('<option value="' + esc(cfg.engines[i].id) + '">' + esc(cfg.engines[i].name) + '</option>');
    }
    sel.innerHTML = opts.join('');
    sel.value = cfg.engineId || cfg.engines[0].id;
    sel.onchange = function () {
      qhBridge.setEngine(this.value);
    };
  }

  /* 联想面板样式兜底同步（第二层；主机制是面板与搜索框同挂 search_bar 类走原生层叠）：
     自定义 CSS 用 #search_bar 等 ID 选择器（类层叠覆盖不到面板）时，
     仍从搜索框计算样式回填 --sg-* 变量；仅在成功读到有效值时覆盖，读不到保留 applySearch 值 */
  function syncSuggestStyle() {
    var s = getComputedStyle(el('search_bar'));
    var r = document.documentElement.style;
    var bg = s.getPropertyValue('background-color');
    var bgImg = s.getPropertyValue('background-image');
    var bf = s.getPropertyValue('backdrop-filter');
    var bfWk = s.getPropertyValue('-webkit-backdrop-filter');
    if (bf === '' || bf === 'none') {
      bf = (bfWk !== '' && bfWk !== 'none') ? bfWk : '';
    }
    if (bg !== '' && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
      r.setProperty('--sg-bg', bg);
    }
    if (bgImg !== '' && bgImg !== 'none') {
      r.setProperty('--sg-bgimg', bgImg);
    } else if (bg !== '' || bf !== '') {
      r.setProperty('--sg-bgimg', 'none');
    }
    if (bf !== '') {
      r.setProperty('--sg-bf', bf);
    }
    var bw = s.getPropertyValue('border-top-width');
    var bc = s.getPropertyValue('border-top-color');
    var br = s.getPropertyValue('border-top-left-radius');
    if (bw !== '') { r.setProperty('--sg-bw', bw); }
    if (bc !== '') { r.setProperty('--sg-bc', bc); }
    if (br !== '') { r.setProperty('--sg-radius', br); }
  }

  window.renderHome = function (data) {
    cfg = data;
    el('incognitoText').textContent = cfg.incognitoText || '';
    el('incognito').className = cfg.incognito ? 'show' : '';
    applyTheme();
    applyBg();
    applySearch();
    applyEngines();
    applyQuick();
    /* 自定义 CSS 先于 Logo 脚本生效（注入脚本会读取计算样式） */
    el('custom').textContent = cfg.customCss || '';
    /* 自定义 CSS 设了 body 背景图时原生背景图层让位（隐藏 #bgimg），忠于 CSS */
    var bgEl = document.getElementById('bgimg');
    if (bgEl) {
      var bbg = getComputedStyle(document.body).backgroundImage;
      bgEl.style.display = (bbg && bbg !== 'none') ? 'none' : '';
    }
    /* 联想面板跟随搜索框最终样式（自定义 CSS 优先） */
    syncSuggestStyle();
    applyLogo();
  };

  /* 原生在 document start 注入的预载配置：页面内联脚本执行到此 DOM 已就绪，
     首帧同步渲染最终样式，免去 onPageEnd 后 runJavaScript 触发的二次重绘 */
  if (window.__QH_CFG__) {
    window.renderHome(window.__QH_CFG__);
  }

  /* 输入法避让（原生推键盘高度 vp）：聚焦的输入框被键盘遮挡时 #wrap 整体上移，收起复位；
     联想面板展开时重算补一次上移（renderSuggests/hideSuggest 触发），按面板期望高度
     抬升整页，让面板与 logo/搜索框一起整体上滚避开键盘；
     rect 测量值含当前 transform，须加回 curLift 还原原始坐标，否则重复调用会误判已避开 */
  var lastKb = 0;
  var curLift = 0;
  window.qhKbAvoid = function (kbVp) {
    lastKb = kbVp || 0;
    var wrap = el('wrap');
    var r = document.documentElement.style;
    /* 主题用 transform 上移搜索框（:focus-within）时，联想面板容器同步跟随；
       容器带 transform 面板自身不带，避免 backdrop-filter 采样错位 */
    var barT = getComputedStyle(el('search_bar')).transform;
    el('suggest_box').style.transform = (barT && barT !== 'none') ? barT : '';
    var ae = document.activeElement;
    var ok = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
    if (!lastKb || lastKb <= 0 || !ok) {
      curLift = 0;
      wrap.style.transform = '';
      r.setProperty('--sg-max', '420px');
      return;
    }
    var kbTop = window.innerHeight - lastKb;
    var inBottom = ae.getBoundingClientRect().bottom + curLift;
    var barBottom = el('search_bar').getBoundingClientRect().bottom + curLift;
    /* 输入框保底：高于键盘 24px */
    var overlap = inBottom - kbTop + 24;
    /* 面板展开：按面板期望高度（内容实际高度，最低 120 保可用）再抬升整页 */
    if (el('suggest_box').className.indexOf('show') >= 0) {
      var want = el('sg_panel').scrollHeight || 120;
      if (want < 120) { want = 120; }
      if (want > 420) { want = 420; }
      var panelLift = barBottom + 6 + want - (kbTop - 12);
      if (panelLift > overlap) { overlap = panelLift; }
    }
    /* 别把搜索框抬出屏幕顶（状态栏下留 96px），抬不够时由下方限高收缩兜底 */
    var maxLift = barBottom - 96;
    if (overlap > maxLift) { overlap = Math.max(0, maxLift); }
    if (overlap < 0) { overlap = 0; }
    if (overlap > 0) {
      wrap.style.transition = 'transform .25s ease';
      wrap.style.transform = 'translateY(' + (-overlap) + 'px)';
    } else {
      wrap.style.transform = '';
    }
    curLift = overlap;
    r.setProperty('--sg-max', Math.max(46, kbTop - (barBottom - overlap) - 18) + 'px');
  };
})();
</script>
</body>
</html>
